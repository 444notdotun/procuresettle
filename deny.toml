[licenses]
allow = ["MIT", "Apache-2.0"]
confidence-threshold = 0.8

exceptions = [
    { crate = "curve25519-dalek@4.1.3", allow = ["BSD-3-Clause"] },
    { crate = "curve25519-dalek@5.0.0", allow = ["BSD-3-Clause"] },
    { crate = "ed25519-dalek@2.2.0", allow = ["BSD-3-Clause"] },
    { crate = "subtle@2.6.1", allow = ["BSD-3-Clause"] },
    { crate = "unicode-ident@1.0.26", allow = ["Unicode-3.0"] },
    { crate = "wasmparser@0.116.1", allow = ["Apache-2.0 WITH LLVM-exception"] },
    { crate = "wasmparser-nostd@0.100.2", allow = ["Apache-2.0 WITH LLVM-exception"] },
]
